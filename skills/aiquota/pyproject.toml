[project]
name = "aiquota"
version = "0.1.0"
description = "Report remaining Claude Code and Codex quotas"
requires-python = ">=3.11"
dependencies = [
    "rich>=13",
    "typer",
]

[project.scripts]
aiquota = "aiquota.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiquota"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyright]
pythonVersion = "3.11"
include = ["src"]
typeCheckingMode = "basic"
