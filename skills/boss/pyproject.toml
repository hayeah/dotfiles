[project]
name = "boss"
version = "0.1.0"
description = "Workflow CLI for the boss skill — workspaces, BOSS.md ↔ agentboss join, lgtm gating"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.scripts]
boss = "boss.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boss"]
